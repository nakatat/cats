server:
  port: ${PORT:${SERVER_PORT:8081}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  application:
    name: cats-api
  mvc:
    servlet:
      path: /api
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cats_api}
    username: ${DATABASE_USERNAME:cats}
    password: ${DATABASE_PASSWORD:cats}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      keepalive-time: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    "[dev.baseballscore.cats.api]": info
    "[org.springframework.web]": info
    "[org.mybatis]": info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
  api-docs:
    path: /v3/api-docs
